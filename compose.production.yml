services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpertz}
      POSTGRES_USER: ${POSTGRES_USER:-vpertz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpertz} -d ${POSTGRES_DB:-vpertz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      whatsapp: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vpertz}
      DB_USERNAME: ${POSTGRES_USER:-vpertz}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      APP_CORS_ALLOWED_ORIGINS: https://www.${DOMAIN:?Defina DOMAIN no .env},https://${DOMAIN:?Defina DOMAIN no .env}
      APP_PUBLIC_BASE_URL: https://www.${DOMAIN:?Defina DOMAIN no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      ADMIN_USER: ${ADMIN_USER:?Defina ADMIN_USER no .env}
      ADMIN_PASS: ${ADMIN_PASS:?Defina ADMIN_PASS no .env}
      STORAGE_TYPE: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no .env}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-vpertz-media}
      WHATSAPP_SERVICE_URL: http://whatsapp:3000
      WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_SERVICE_TOKEN:?Defina WHATSAPP_SERVICE_TOKEN no .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks: [internal]

  whatsapp:
    build: ./whatsapp-service
    restart: unless-stopped
    environment:
      WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_SERVICE_TOKEN:?Defina WHATSAPP_SERVICE_TOKEN no .env}
      WHATSAPP_AUTH_DIR: /data/auth
      WHATSAPP_GROUP_JID: ${WHATSAPP_GROUP_JID:-}
    volumes:
      - whatsappdata:/data/auth
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend]
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  miniodata:
  whatsappdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
