server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # DNS interno do Docker: permite ao Nginx RE-RESOLVER o serviço `backend` a
    # cada requisição (via variável no proxy_pass), em vez de fixar o IP no boot.
    # Sem isto, um `restart` isolado do backend troca o IP do container e o proxy
    # passa a responder 502 até o Nginx ser reiniciado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API do backend (mesma origem — sem CORS no navegador).
    location /api/ {
        # Variável força a resolução dinâmica; $request_uri preserva caminho+query.
        set $backend_api http://backend:8080;
        proxy_pass $backend_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 5m;
    }

    # Uploads servidos pelo backend.
    location /media/ {
        set $backend_media http://backend:8080;
        proxy_pass $backend_media$request_uri;
        proxy_set_header Host $host;
    }

    # A pasta contém apenas a página estática de intermédio; a home da Store
    # continua pertencendo ao SPA React.
    location = /store {
        try_files /store/index.html /index.html =404;
    }
    location = /store/ {
        return 308 /store;
    }

    # O serviço de intermédio agora pertence ao SPA React.
    location = /store/intermedio {
        try_files $uri/index.html /index.html =404;
    }

    location = /store/negociar {
        try_files $uri/index.html /index.html =404;
    }

    location = /store/contato {
        try_files $uri/index.html /index.html =404;
    }

    location = /store/jogos {
        try_files $uri/index.html /index.html =404;
    }

    location = /store/offline {
        try_files /index.html =404;
    }

    location = /store/admin {
        return 308 /admin;
    }

    location = /store/jogos.html {
        return 308 /store/jogos;
    }

    location = /store/offline.html {
        return 308 /store/offline;
    }

    location = /store/intermedio.html {
        return 308 /store/intermedio;
    }

    location = /store/admin.html {
        return 308 /admin;
    }

    location = /store/index.html { return 308 /store/; }
    location = /store/negociar.html { return 308 /store/negociar; }
    location = /store/contato.html { return 308 /store/contato; }

    # O Avaliar IV já é React. As demais ferramentas continuam isoladas em
    # /vplab/legacy/ durante a migração progressiva.
    location = /vplab {
        try_files /vplab/index.html /index.html =404;
    }
    location = /vplab/ {
        try_files /vplab/index.html /index.html =404;
    }
    location = /vplab/avaliar-iv {
        try_files $uri/index.html /index.html =404;
    }
    location = /vplab/pokedex {
        try_files $uri/index.html /index.html =404;
    }
    location = /vplab/pokefipe {
        try_files $uri/index.html /index.html =404;
    }
    location = /vplab/rota {
        try_files $uri/index.html /index.html =404;
    }
    location = /vplab/breeding {
        try_files $uri/index.html /index.html =404;
    }
    location = /vplab/clas {
        try_files $uri/index.html /index.html =404;
    }
    location = /vplab/profissoes {
        try_files $uri/index.html /index.html =404;
    }

    location = /vplab/index.html { return 308 /vplab/; }
    location = /vplab/avaliar-iv-v4.html { return 308 /vplab/avaliar-iv; }
    location = /vplab/pokedex-v2.html { return 308 /vplab/pokedex; }
    location = /vplab/pokefipe-v2.html { return 308 /vplab/pokefipe; }
    location = /vplab/breeding-v2.html { return 308 /vplab/breeding; }

    # Marketplace já migrado: o diretório físico /bazaar permanece apenas para
    # as páginas legadas ainda não convertidas, mas não pode vencer a rota index.
    location = /bazaar/ {
        return 308 /bazaar;
    }

    location = /bazaar {
        try_files /bazaar/index.html /index.html =404;
    }

    # Autenticação já migrada. As páginas físicas restantes do Bazaar não
    # podem capturar estas rotas antes do React Router.
    location = /bazaar/login {
        try_files /index.html =404;
    }

    location = /bazaar/cadastro {
        try_files /index.html =404;
    }

    location = /bazaar/perfil {
        try_files /index.html =404;
    }

    location = /bazaar/anunciar {
        try_files /index.html =404;
    }

    location = /bazaar/meus-anuncios {
        try_files /index.html =404;
    }

    location = /bazaar/chat {
        try_files /index.html =404;
    }

    # "Como funciona" e "Minha conta" migradas para React; as páginas físicas
    # legadas (.html) não podem capturar estas rotas antes do React Router.
    location = /bazaar/como-funciona {
        try_files $uri/index.html /index.html =404;
    }

    location = /bazaar/conta {
        try_files /index.html =404;
    }

    # Links históricos deixam de servir os HTMLs físicos e convergem para o SPA.
    location = /bazaar/como-funciona.html {
        return 308 /bazaar/como-funciona;
    }

    location = /bazaar/conta.html {
        return 308 /bazaar/conta;
    }

    location = /bazaar/index.html { return 308 /bazaar/; }
    location = /bazaar/anunciar.html { return 308 /bazaar/anunciar; }
    location = /bazaar/chat.html { return 308 /bazaar/chat; }
    location = /bazaar/meus-anuncios.html { return 308 /bazaar/meus-anuncios; }
    location = /bazaar/perfil.html { return 308 /bazaar/perfil; }
    location = /bazaar/anuncio.html {
        if ($arg_id != "") { return 308 /bazaar/anuncio/$arg_id; }
        return 308 /bazaar/;
    }

    location = /comunidade.html { return 308 /comunidade; }
    location = /comunidade { try_files /comunidade/index.html /index.html =404; }
    location = /admin.html { return 308 /admin; }

    # Assets do SPA com cache longo.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # SPA: qualquer rota cai no index.html (React Router resolve).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
