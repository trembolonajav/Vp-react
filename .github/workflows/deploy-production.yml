name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vperts-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Google VM
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vperts_deploy
          chmod 600 ~/.ssh/vperts_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update production
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh \
            -i ~/.ssh/vperts_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'cd /opt/vperts/app && ./deploy/deploy-production.sh'

