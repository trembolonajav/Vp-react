<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VP Store — Sem conexão</title>
<meta name="theme-color" content="#0a0605">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 24px; text-align: center;
    background: #0a0605; color: #f3e9dc;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .card { max-width: 420px; }
  img { width: 96px; height: 96px; margin: 0 auto 20px; display: block; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #b8a894; font-size: 15px; line-height: 1.55; margin: 0 0 24px; }
  a.btn {
    display: inline-block; padding: 12px 26px; border-radius: 999px;
    background: #c23629; color: #fff; text-decoration: none; font-weight: 700;
  }
</style>
<script src="/family-nav.js" defer></script>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="VP Store">
    <h1>Você está sem conexão</h1>
    <p>Não foi possível carregar a VP Store agora. Verifique sua internet e tente novamente.</p>
    <a class="btn" href="/">Tentar de novo</a>
  </div>
</body>
</html>
