# Sobe a plataforma para desenvolvimento local: banco + backend.
# O frontend (React) e o storage (MinIO) entram nas fases seguintes.
# Segredos ficam no arquivo .env (ver .env.example) — nunca versionados.

services:
  postgres:
    image: postgres:16-alpine
    container_name: vpertz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpertz}
      POSTGRES_USER: ${POSTGRES_USER:-vpertz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpertz}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpertz} -d ${POSTGRES_DB:-vpertz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpertz

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vpertz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vpertz}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vpertz-minio-dev}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vpertz

  backend:
    build:
      context: ./backend
    container_name: vpertz-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vpertz}
      DB_USERNAME: ${POSTGRES_USER:-vpertz}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vpertz}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8190,http://127.0.0.1:8190}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8190}
      STORAGE_TYPE: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-vpertz}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-vpertz-minio-dev}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-vpertz-media}
      WHATSAPP_SERVICE_URL: http://whatsapp:3000
      WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_SERVICE_TOKEN:-dev-whatsapp-token}
    ports:
      - "${BACKEND_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - vpertz

  whatsapp:
    build: ./whatsapp-service
    container_name: vpertz-whatsapp
    restart: unless-stopped
    environment:
      WHATSAPP_SERVICE_TOKEN: ${WHATSAPP_SERVICE_TOKEN:-dev-whatsapp-token}
      WHATSAPP_AUTH_DIR: /data/auth
      WHATSAPP_GROUP_JID: ${WHATSAPP_GROUP_JID:-}
    volumes:
      - whatsappdata:/data/auth
    networks:
      - vpertz

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vpertz-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8190}:80"
    networks:
      - vpertz

volumes:
  pgdata:
  miniodata:
  whatsappdata:

networks:
  vpertz:
    driver: bridge
