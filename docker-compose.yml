# Sobe a plataforma para desenvolvimento local: banco + backend.
# O frontend (React) e o storage (MinIO) entram nas fases seguintes.
# Segredos ficam no arquivo .env (ver .env.example) — nunca versionados.

services:
  postgres:
    image: postgres:16-alpine
    container_name: vpertz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpertz}
      POSTGRES_USER: ${POSTGRES_USER:-vpertz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpertz}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpertz} -d ${POSTGRES_DB:-vpertz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpertz

  backend:
    build:
      context: ./backend
    container_name: vpertz-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vpertz}
      DB_USERNAME: ${POSTGRES_USER:-vpertz}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vpertz}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - vpertz

volumes:
  pgdata:

networks:
  vpertz:
    driver: bridge
