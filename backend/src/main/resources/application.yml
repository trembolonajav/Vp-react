# Configuração base. Valores sensíveis vêm de variáveis de ambiente
# (ver .env.example). Perfis: dev (padrão local) e prod.
spring:
  application:
    name: vpertz-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vpertz}
    username: ${DB_USERNAME:vpertz}
    password: ${DB_PASSWORD:vpertz}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate nunca altera tabelas.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Endereço do frontend liberado no CORS (nunca "*" com credenciais).
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
