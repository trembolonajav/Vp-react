# Configuração base. Valores sensíveis vêm de variáveis de ambiente
# (ver .env.example). Perfis: dev (padrão local) e prod.
spring:
  application:
    name: vpertz-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # Uploads de imagem: o limite fino (2,5MB) é conferido no MediaController.
      max-file-size: 3MB
      max-request-size: 3MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vpertz}
    username: ${DB_USERNAME:vpertz}
    password: ${DB_PASSWORD:vpertz}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate nunca altera tabelas.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Endereço do frontend liberado no CORS (nunca "*" com credenciais).
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8090}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Em produção SEMPRE via ambiente. O default é apenas para dev local.
    secret: ${JWT_SECRET:dev-jwt-secret-troque-em-producao-min-32-bytes-ok}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  admin:
    # Semente do administrador do painel (dev). Em produção use variáveis reais.
    username: ${ADMIN_USER:vpadmin}
    password: ${ADMIN_PASS:vpadmin123}
  storage:
    type: ${STORAGE_TYPE:local}
    # Fallback de desenvolvimento quando STORAGE_TYPE=local.
    dir: ${STORAGE_DIR:./.media}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
      access-key: ${STORAGE_S3_ACCESS_KEY:minioadmin}
      secret-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
      bucket: ${STORAGE_S3_BUCKET:vpertz-media}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
